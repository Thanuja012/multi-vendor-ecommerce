version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: multivendor-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: multivendor-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/multivendor_db
      - JWT_SECRET=multivendor_super_secret_key_2026_change_in_production
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: multivendor-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
